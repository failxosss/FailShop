# =========================================
#           FailShop - price.yml
# =========================================
# Here you set the categories and the prices of everything in the shop.
#
# One item per line:
#     BLOCK_NAME: {buy: <buy price>, sell: <sell price>}
#   BLOCK_NAME = the Minecraft material name (DIRT, DIAMOND, OAK_LOG ...)
#   buy        = price when the player BUYS it   (omit or -1 = cannot be bought)
#   sell       = price when the player SELLS it  (omit or -1 = cannot be sold)
#
# Optional per item:
#   head: "Nick"          # show the head of this player instead of the block icon (default: gui.item-head in config.yml)
#   name: "&aCustom name" # string or per-language map {cs: "...", en: "..."}; default = block name
#   lore: ["&7Line"]
#   material: DIRT        # only needed when the key is not the material name (e.g. command items)
#   commands: ["give {player} ..."]   # console commands run on purchase (the item itself is then not given)
#
# Categories:
#   <id>:
#     name: {cs: "TEXT", en: "TEXT"}   # or a plain string
#     icon: GRASS_BLOCK                # material of the category button
#     head: "Nick"                     # player head (nick, texture URL, base64 or hash) as category icon (default: gui.category-head)
#     color: "&a"                      # color of the category name / menu title (&-codes or &#RRGGBB)
#     slot: 10                         # slot in the main menu (0-44), omit for automatic placement
#     lore: ["&7Optional lines"]
#
# Click behaviour: left = buy 1, shift+left = buy a stack,
# right = sell 1, shift+right = sell all of that item.
# All GUI texts are shown in capital letters (gui.text-style in config.yml).

