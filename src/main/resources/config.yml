# =========================================
#               FailShop
# =========================================

# Language of all texts. Uses the file lang/<code>.yml
# Bundled: en (English), cs (Čeština). You can add your own lang/xx.yml.
# After changing it use /shopadmin reload
language: en

# Symbol shown after every price. Color codes are allowed.
# Use a resource-pack / ItemsAdder glyph here if you have one.
currency-symbol: "&6$"

gui:
  # Background item of the menus
  filler: GRAY_STAINED_GLASS_PANE
  # Every text in the menus (titles, item names, lore, buttons) is shown in CAPITAL LETTERS
  uppercase-names: true
  # Player head (by nickname) shown instead of the block icon of the MAIN MENU categories.
  # Set a different nick per category with "head: Nick" in price.yml. Empty = show the block icon.
  category-head: "Notch"
  # Same for the items INSIDE the categories (empty = real block icons). Per item: "head: Nick" in price.yml.
  item-head: ""
  # Color of the item names in the menus (items without their own name in price.yml)
  item-name-color: "&f"
  # Extra button in the main menu that sells everything sellable in your inventory
  sell-all-button: false

# Prices react to demand: buying makes an item more expensive, selling cheaper.
# The price slowly returns to normal over time.
dynamic-pricing:
  enabled: false
  min: 0.5
  max: 2.0
  step: 0.0015
  recovery-interval-minutes: 10
  recovery-rate: 0.1

# A rotating set of discounted items shown in the main menu.
daily-deals:
  enabled: false
  count: 5
  min-discount: 15
  max-discount: 45
  duration-hours: 24

# Every purchase and sale is written to plugins/FailShop/transactions.log
log-transactions: true

# Sounds use vanilla sound keys. Leave empty to disable.
sounds:
  success: "entity.experience_orb.pickup"
  error: "entity.villager.no"

# Automatic updates from Spigot (via Spiget).
# Set resource-id to the number at the end of your Spigot resource URL.
# The new jar is downloaded to plugins/update and installed on the next restart.
update-checker:
  enabled: true
  auto-download: true
  check-interval-hours: 6
  resource-id: 0
