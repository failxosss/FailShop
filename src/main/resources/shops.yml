# =========================================
#           FailShop - shops.yml
# =========================================
# categories:
#   <id>:
#     name: "TEXT"                     # or a map per language: {cs: "...", en: "..."}
#     icon: GRASS_BLOCK                # material of the category button
#     head: "<texture>"                # optional: custom head (base64 value, texture URL or texture hash)
#     slot: 10                         # slot in the main menu (0-44), omit for automatic placement
#     lore: ["&7Optional lines"]
#     items:
#       <id>:
#         material: DIRT
#         buy: 1.5                     # omit or -1 = cannot be bought
#         sell: 0.1                    # omit or -1 = cannot be sold
#         name: "&aCustom name"        # optional (string or per-language map), default = vanilla name
#         lore: ["&7Optional"]         # optional
#         head: "<texture>"            # optional, for material PLAYER_HEAD
#         commands: ["give {player} ..."]   # optional: console commands run on purchase (item is then not given)
#
# Click behaviour: left = buy 1, shift+left = buy a stack,
# right = sell 1, shift+right = sell all of that item.

